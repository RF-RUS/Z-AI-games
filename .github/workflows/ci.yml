name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --all-packages
      - name: Lint
        run: uv run ruff check .
      - name: Security scan
        run: uv run bandit -r services/ packages/ -ll --skip B101

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --all-packages
      - name: Run unit + contract tests (coverage gate 60%)
        run: uv run pytest tests/unit tests/contracts -v --tb=short --cov=services --cov=packages --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn

  smoke-mock:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --all-packages
      - name: Run smoke tests (mock only)
        run: uv run pytest tests/smoke -v --tb=short -m smoke -k "not pizzuno"

  # Quality gate: the platform's eval harness runs the scenario datasets through
  # the full operator pipeline in-process and appends to models/benchmarks/
  # history.jsonl — the long-run quality curve. A regression dips this number.
  eval:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --all-packages
      - name: Run evaluation dataset (gate success_rate >= 0.8)
        run: uv run python scripts/run-eval.py --dataset full_operator --min-success 0.8
      - name: Upload quality history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-history
          path: models/benchmarks/history.jsonl
          if-no-files-found: ignore

  integration:
    runs-on: ubuntu-latest
    needs: smoke-mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --all-packages
      - name: Run integration tests
        # NO "|| true" here: it made this job swallow every failure, so a red
        # integration suite still reported green (the 2026-08-16 audit found
        # 8 failing tests behind a green CI badge).
        run: uv run pytest tests/integration -v --tb=short

  # Frontend: Control Center (Electron/React) previously had zero CI coverage —
  # a broken build or failed TS test never surfaced until someone ran the desktop
  # app. Type-check + vitest on every PR now.
  frontend:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      # npm workspaces live at the repo root; skip the Electron binary download
      # — CI only type-checks and unit-tests, it does not launch the desktop app.
      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci
      - name: Type-check (tsc)
        working-directory: apps/control-center
        run: npx tsc --noEmit
      - name: Unit tests (vitest)
        working-directory: apps/control-center
        run: npx vitest run
