name: Windows

# adapter-windows (pywinauto/UIA) cannot be exercised on ubuntu runners — this
# closes the "half the stack is a blind spot" gap. Mock-based windows unit tests
# plus the offline smoke suite run on a real Windows runner. Live-GUI e2e
# (launching the mock window app) stays local per docs/runbooks; those tests
# auto-skip when the target app cannot start.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  windows-mock:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --all-packages
      - name: Unit tests (includes pywinauto-mocked windows paths)
        shell: pwsh
        run: uv run pytest tests/unit -v --tb=short
      - name: Smoke tests (offline)
        shell: pwsh
        run: uv run pytest tests/smoke -v --tb=short -m smoke
      - name: Lint
        shell: pwsh
        run: uv run ruff check .
