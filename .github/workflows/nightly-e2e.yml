name: Nightly E2E

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  # Offline quality curve: runs the full operator eval datasets IN-PROCESS
  # (no live services), appends metrics to models/benchmarks/history.jsonl.
  # Complements CI's gate by also measuring shadow agreement (heuristic vs
  # model) — the signal used to decide when a strategy promotes to primary.
  evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --all-packages
      - name: Run full dataset
        run: python scripts/run-eval.py --dataset full_operator
      - name: Run full dataset with shadow evaluation
        run: python scripts/run-eval.py --dataset full_operator --shadow
      - name: Upload quality history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-history
          path: models/benchmarks/history.jsonl
          retention-days: 90

  pizzuno-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --all-packages
      - name: Install Playwright
        run: |
          python -m playwright install chromium
          python -m playwright install-deps
      - name: Run Pizzuno E2E smoke
        # The e2e file is tests/e2e/test_pizzuno_e2e.py (the smoke path below
        # never existed — the nightly job failed at collection every night).
        # Marker -m e2e matches the file's documented invocation.
        run: python -m pytest tests/e2e/test_pizzuno_e2e.py -v --tb=long -m e2e
      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts/ci-run
          cp -r services/artifacts/* artifacts/ci-run/ 2>/dev/null || true
          cp -r artifacts/profile-health/* artifacts/ci-run/ 2>/dev/null || true
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pizzuno-e2e-artifacts
          path: |
            artifacts/ci-run/
            .pytest_cache/
          retention-days: 30

  summary:
    runs-on: ubuntu-latest
    needs: pizzuno-e2e
    if: always()
    steps:
      - name: Report status
        run: |
          if [ "${{ needs.pizzuno-e2e.result }}" = "success" ]; then
            echo "✅ Pizzuno E2E: PASSED"
          else
            echo "❌ Pizzuno E2E: FAILED"
            exit 1
          fi
