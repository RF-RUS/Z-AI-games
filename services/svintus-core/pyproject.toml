[project]
name = "svintus-core"
version = "0.1.0"
description = "Svintus rules engine — in-process game plugin (no own port)"
requires-python = ">=3.11"
dependencies = [
    "uno-schemas",
    "uno-shared-utils",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/svintus_core"]

[tool.uv.sources]
uno-schemas = { workspace = true }
uno-shared-utils = { workspace = true }
